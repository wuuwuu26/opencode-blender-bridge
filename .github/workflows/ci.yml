name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Python syntax check
        run: |
          python3 - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir('assets', quiet=1)
          sys.exit(0 if ok else 1)
          PY
